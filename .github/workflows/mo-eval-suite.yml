name: mo-eval suite
on:
  workflow_dispatch:
    inputs:
      arms:
        description: Models to evaluate, space-separated ("none" = build the suite only)
        default: "anthropic/claude-opus-5 momento/zai-org/GLM-5.3"
      candidates:
        description: >-
          How many candidates to validate. Lowered from the Action's default of 12 because this
          repository's orders payload exceeds the Function URL's 6 MB limit at 12 (#3966) — the
          payload carries the source of every selected change, so it scales with this number.
        default: "4"
permissions:
  contents: read
  pull-requests: read
  id-token: write   # the job authenticates to mo-eval as this repository; no secret to manage
jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: momentohq/mo-eval-action@v1
        with:
          arms: ${{ inputs.arms }}
          candidates: ${{ inputs.candidates }}
